<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scan to connect</title>
<meta name="theme-color" content="#f4f1ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My QR">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d9542b'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%23fff' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tapcard.css">
<style>
  body {
    min-height: 100dvh; overflow-x: hidden;
    padding: max(22px, env(safe-area-inset-top)) 16px max(22px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 18px;
  }
  header { text-align: center; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 99px;
    background: var(--chip); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: blink 2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  h1 { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: clamp(32px, 10vw, 46px); line-height: 1.05; letter-spacing: -.015em; margin-top: 16px; overflow-wrap: anywhere; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .sub b { font-weight: 500; letter-spacing: .12em; margin-right: 6px; }

  .stage { position: relative; width: min(82vw, 360px); aspect-ratio: 1; perspective: 1200px; }
  .pulse { position: absolute; inset: 0; pointer-events: none; }
  .pulse span { position: absolute; inset: 0; border-radius: 34px; border: 1.5px solid var(--accent); opacity: 0; animation: pulse 3.6s cubic-bezier(.2,.7,.3,1) infinite; }
  .pulse span:nth-child(2) { animation-delay: 1.2s; }
  .pulse span:nth-child(3) { animation-delay: 2.4s; }
  @keyframes pulse { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(1.22); opacity: 0; } }
  .card {
    position: absolute; inset: 0; border-radius: 30px; background: #fff;
    box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 18px 40px -18px rgba(60,40,20,.35);
    transform-style: preserve-3d; transition: transform .7s cubic-bezier(.3,1.3,.5,1); cursor: pointer;
  }
  .card.flip { transform: rotateY(180deg); }
  .face { position: absolute; inset: 7%; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .face.back { transform: rotateY(180deg); }
  .face svg { width: 100%; height: 100%; display: block; }
  .ticks { position: absolute; inset: -10px; pointer-events: none; }
  .ticks b { position: absolute; width: 26px; height: 26px; border: 3px solid var(--ink); }
  .ticks b:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 14px; }
  .ticks b:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 14px; }
  .ticks b:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 14px; }
  .ticks b:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 14px; }

  .caption { text-align: center; min-height: 3.2em; max-width: 360px; }
  .caption .big { font-family: Fraunces, Georgia, serif; font-style: italic; font-size: 19px; }
  .caption .small { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
  .caption > * { transition: opacity .25s ease; }
  .caption.swap > * { opacity: 0; }

  .seg { position: relative; display: grid; grid-template-columns: 1fr 1fr; background: var(--chip); border-radius: 99px; padding: 4px; width: min(82vw, 320px); }
  .seg button { position: relative; z-index: 1; border: 0; background: none; color: var(--muted); font: 600 14.5px Inter, system-ui, sans-serif; padding: 11px 0; border-radius: 99px; cursor: pointer; transition: color .25s ease; }
  .seg button[aria-pressed="true"] { color: var(--bg); }
  .seg .thumb { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); background: var(--ink); border-radius: 99px; transition: transform .45s cubic-bezier(.3,1.3,.5,1); }
  .seg.b .thumb { transform: translateX(100%); }

  footer { display: flex; gap: 14px; align-items: center; font-size: 12.5px; color: var(--muted); }
  footer button, footer a { border: 0; background: none; color: inherit; font: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 6px 2px; }
  .awake { display: inline-flex; align-items: center; gap: 6px; }
  .awake i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  .awake.on i { background: var(--ok); }
  .notice { margin: auto; text-align: center; }
  .notice h1 { font-size: 28px; }
  .notice p { color: var(--muted); }

  @media (prefers-reduced-motion: reduce) { .pulse, .pill i { animation: none; display: none; } .card { transition: none; } }
  @media (max-height: 640px) { h1 { font-size: 30px; margin-top: 10px; } .stage { width: min(70vw, 300px); } }
</style>
</head>
<body>
  <div class="notice" id="notice"><p>Loading…</p></div>

  <header id="head" hidden>
    <span class="pill" id="pill" hidden><i></i><span id="event"></span></span>
    <h1 id="name"></h1>
    <p class="sub" id="sub"></p>
  </header>

  <div class="stage" id="stage" hidden>
    <div class="pulse" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="ticks" aria-hidden="true"><b></b><b></b><b></b><b></b></div>
    <div class="card" id="card" role="img" aria-label="QR code">
      <div class="face front" id="front"></div>
      <div class="face back" id="back"></div>
    </div>
  </div>

  <div class="caption" id="caption" aria-live="polite" hidden>
    <p class="big" id="capBig"></p>
    <p class="small" id="capSmall"></p>
  </div>

  <div class="seg" id="seg" role="group" aria-label="What to share" hidden>
    <span class="thumb"></span>
    <button type="button" aria-pressed="true" data-i="0">My card</button>
    <button type="button" aria-pressed="false" data-i="1" id="tab2">My work</button>
  </div>

  <footer id="foot" hidden>
    <span class="awake" id="awake"><i></i><span id="awakeTxt">Screen may dim</span></span>
    <button type="button" id="fs">Full screen</button>
    <a id="editLink" href="#" hidden>Edit</a>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="config.js"></script>
  <script src="tapcard.js"></script>
  <script>
  (() => {
    const $ = id => document.getElementById(id);
    const slug = TC.slugFromQuery(location.search);
    const notice = (h, p) => {
      ['head', 'stage', 'caption', 'seg', 'foot'].forEach(id => $(id).hidden = true);
      $('notice').hidden = false;
      $('notice').innerHTML = `<h1 class="serif">${TC.esc(h)}</h1><p>${TC.esc(p)}</p>`;
    };
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
    if (!slug) return notice('No card chosen', 'This page needs a card link.');

    const card = $('card'), seg = $('seg'), caption = $('caption');
    let MODES = [], mode = 0, shown = '';

    function setMode(i, instant) {
      if (!MODES[i] || (i === mode && !instant)) return;
      mode = i;
      card.classList.toggle('flip', i === 1);
      seg.classList.toggle('b', i === 1);
      seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.i === i));
      const put = () => { $('capBig').textContent = MODES[i].big; $('capSmall').textContent = MODES[i].small; caption.classList.remove('swap'); };
      if (instant) return put();
      caption.classList.add('swap'); setTimeout(put, 250);
    }

    // Draws (or redraws) everything from one card's data.
    function render(d) {
      const sig = JSON.stringify(d);
      if (sig === shown) return;
      shown = sig;
      document.title = `${d.name} · Scan to connect`;
      TC.applyAccent(document.documentElement, d.accent);
      $('notice').hidden = true;
      ['head', 'stage', 'caption', 'foot'].forEach(id => $(id).hidden = false);
      $('pill').hidden = !d.event; $('event').textContent = d.event || '';
      $('name').textContent = d.name;
      $('sub').innerHTML = (d.altName ? `<b>${TC.esc(d.altName)}</b>` : '') + TC.esc([d.role, d.affiliation].filter(Boolean).join(' · '));
      const f = d.featured || {}, flink = TC.href(f.link);
      MODES = [{ url: TC.cardUrl(slug), big: 'Point your camera here', small: 'Card, CV & contact in one scan' }];
      if (flink) MODES.push({ url: flink, big: f.title || 'Take a look', small: f.meta || f.label || '' });
      $('front').innerHTML = TC.qrSvg(MODES[0].url, d.photo, d.accent);
      $('back').innerHTML = MODES[1] ? TC.qrSvg(MODES[1].url, d.photo, d.accent) : '';
      $('tab2').textContent = f.tab || 'My work';
      seg.hidden = !MODES[1];
      setMode(MODES[mode] ? mode : 0, true);
    }

    seg.addEventListener('click', e => { const b = e.target.closest('button'); if (b) setMode(+b.dataset.i); });
    card.addEventListener('click', () => setMode(1 - mode));
    let sx = null;
    card.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
    card.addEventListener('touchend', e => {
      if (sx === null) return;
      const dx = e.changedTouches[0].clientX - sx; sx = null;
      if (Math.abs(dx) > 40) setMode(dx < 0 ? 1 : 0);
    });

    // Show the last saved copy at once (works offline), then refresh quietly.
    const saved = TC.cached(slug);
    if (saved) render(saved);
    TC.getCard(slug).then(d => {
      if (d) render(d);
      else if (!saved) notice('No card here', `Nobody has claimed “${slug}” yet.`);
      else notice('This card was deleted', 'Its owner removed it.');
    }).catch(() => { if (!saved) notice('No connection', 'Open this page once with internet and it will work offline after that.'); });

    // The owner (who has the edit key on this device) gets a quiet Edit link.
    try {
      const t = localStorage.getItem('tapcard-token-' + slug);
      if (t) { $('editLink').href = `./?edit=${encodeURIComponent(slug)}#${t}`; $('editLink').hidden = false; }
    } catch (e) {}

    // Keep the screen awake while someone is scanning.
    const awake = $('awake'), awakeTxt = $('awakeTxt');
    async function keepAwake() {
      try {
        const lock = await navigator.wakeLock.request('screen');
        awake.classList.add('on'); awakeTxt.textContent = 'Screen stays on';
        lock.addEventListener('release', () => { awake.classList.remove('on'); awakeTxt.textContent = 'Screen may dim'; });
      } catch (e) {}
    }
    if ('wakeLock' in navigator) {
      keepAwake();
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
    } else awake.hidden = true;
    const fs = $('fs');
    if (!document.documentElement.requestFullscreen) fs.hidden = true;
    fs.addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {});
    });
  })();
  </script>
</body>
</html>
