<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scan to connect</title>
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My QR">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d9542b'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%23fff' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tapcard.css?v=4">
<link rel="stylesheet" href="qr.css?v=4">
</head>
<body>
  <div class="notice" id="notice"><p>Loading…</p></div>

  <header id="head" hidden>
    <span class="pill" id="pill" hidden><i></i><span id="event"></span></span>
    <h1 id="name"></h1>
    <p class="sub" id="sub"></p>
  </header>

  <div class="stage" id="stage" hidden>
    <div class="pulse" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="ticks" aria-hidden="true"><b></b><b></b><b></b><b></b></div>
    <div class="card" id="card" role="img" aria-label="QR code">
      <div class="face front" id="front"></div>
      <div class="face back" id="back"></div>
    </div>
  </div>

  <div class="caption" id="caption" aria-live="polite" hidden>
    <p class="big" id="capBig"></p>
    <p class="small" id="capSmall"></p>
  </div>

  <div class="seg" id="seg" role="group" aria-label="What to share" hidden>
    <span class="thumb"></span>
    <button type="button" aria-pressed="true" data-i="0">My card</button>
    <button type="button" aria-pressed="false" data-i="1" id="tab2">My work</button>
  </div>

  <footer id="foot" hidden>
    <span class="awake" id="awake"><i></i><span id="awakeTxt">Screen may dim</span></span>
    <button type="button" id="fs">Full screen</button>
    <a id="editLink" href="#" hidden>Edit</a>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="config.js?v=4"></script>
  <script src="tapcard.js?v=4"></script>
  <script src="qr.js?v=4"></script>
</body>
</html>
