<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tap Card</title>
<script>
  // Tap Card moved to /t/. Old ?u=alex links become ?alex; edit links keep their key.
  (function () {
    var P = new URLSearchParams(location.search), q = '';
    if (P.get('u')) { q = '?' + P.get('u'); P.delete('u'); var rest = P.toString(); if (rest) q += '&' + rest; }
    else if (location.search) q = location.search;
    location.replace('/t/' + (location.pathname.endsWith('qr.html') ? 'qr.html' : '') + q + location.hash);
  })();
</script>
</head><body><p><a href="/t/">Tap Card has moved.</a></p></body></html>
